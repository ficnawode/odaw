[workspace]
resolver = "3"
members = [
    "core",
    "engine",
    "dsp",
    "compile",
    "io",
    "render",
    "platform",
    "format",
    "control",
    "ui",
    "apps/odaw-cli",
    "apps/odaw-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18"
eframe = "0.32"
im = "15"
postcard = { version = "1", features = ["use-std"] }
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "pcm", "id3v1", "id3v2"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
